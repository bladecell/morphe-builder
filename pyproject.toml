[project]
name = "morphe-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "packaging>=26.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "python-multipart>=0.0.20",
    "apprise>=1.9.2",
    "uvicorn>=0.42.0",
    "cloakbrowser>=0.5.12,<0.6",
    "selectolax>=0.4.10",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
