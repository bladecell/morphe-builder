<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app.name }} - Morphe Builder</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; border: 1px solid #334155; max-width: 500px; margin: auto; }
        h1 { margin-top: 0; color: #818cf8; }
        .version { font-weight: bold; color: #fbbf24; }
        a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #4f46e5; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: bold; }
        a:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ app.name }}</h1>
        <p>Package ID: <code>{{ app.id }}</code></p>
        <p>Latest Version: <span class="version">{{ version }}</span></p>
        <!-- Obtainium looks for links ending in .apk -->
        <a href="{{ download_url }}">Download {{ app.id }}-v{{ version }}.apk</a>
        <p style="font-size: 0.7rem; color: #64748b; margin-top: 2rem;">
            Generated by Morphe Builder for Obtainium HTML Source extraction.
        </p>
    </div>
</body>
</html>
